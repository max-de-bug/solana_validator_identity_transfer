[package]
name = "validator-shift-cli"
version = "0.1.0"
edition = "2021"
authors = ["Connor"]
description = "A CLI tool for securely transferring Solana validator identities."

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "env"] }
dialoguer = "0.11"
indicatif = "0.17" # For loading spinners

# Async runtime & HTTP client
tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography (matching frontend's Web Crypto AES-256-GCM and PBKDF2-SHA256)
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
