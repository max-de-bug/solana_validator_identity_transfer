[package]
name = "validator-identity-transfer"
version = "1.0.0"
edition = "2021"
description = "Secure Solana Validator Identity Transfer API"
license = "MIT"

[dependencies]
# Web framework
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"
actix-ws = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Cryptography
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"

# Solana
solana-sdk = "2.2"
solana-client = "2.2"

# Auth & Security
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }

# Validation
validator = { version = "0.19", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Rate limiting
actix-governor = "0.6"

# Utilities
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
thiserror = "2"
dotenv = "0.15"
bs58 = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
